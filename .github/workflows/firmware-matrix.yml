name: Firmware boot matrix

# Boots an already-built ISO (the mpireos-iso artifact of a "Build ISO" run)
# under every firmware/drive combination in scripts/firmware-matrix.sh, so a
# report like "doesn't boot in Proxmox" can be checked against the exact image.
# Build ISO runs the same matrix on every new image.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the Build ISO run whose ISO to test
        required: true

permissions:
  actions: read
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/download-artifact@v4
        with:
          name: mpireos-iso
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out

      - name: Check the ISO's checksum
        run: sha256sum -c out/SHA256SUMS && ls -l out/*.iso

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 ovmf

      - name: Boot under BIOS and UEFI, on IDE, SATA, VirtIO SCSI and USB
        run: scripts/firmware-matrix.sh out/*.iso
