name: Build ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to build
        default: stable
        type: choice
        options: [stable, testing]

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build packages and ISO in an Arch Linux container
        env:
          MPIRE_SIGNING_KEY: ${{ secrets.MPIRE_SIGNING_KEY }}
          # Packages built for publishing must be signed once the project key exists.
          REQUIRE_SIGNING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker run --rm --privileged \
            -v "$PWD:/src" -w /src \
            -e MPIRE_SIGNING_KEY -e REQUIRE_SIGNING \
            archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed archiso base-devel grub \
              && ./scripts/build-packages.sh /src/out/repo '${{ inputs.channel || 'stable' }}' \
              && ./iso/build.sh '${{ inputs.channel || 'stable' }}' /src/out"
          sudo chown -R "$(id -u):$(id -g)" out
          sha256sum out/*.iso | tee out/SHA256SUMS

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot test in QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86
          SERIAL_LOG=out/serial.log SCREENSHOT=out/live-desktop.ppm scripts/smoke-test.sh out/*.iso 1200

      - name: Firmware boot matrix (BIOS and UEFI; IDE, SATA, VirtIO SCSI and USB, as Proxmox offers them)
        run: |
          sudo apt-get install -yq --no-install-recommends ovmf
          scripts/firmware-matrix.sh out/*.iso

      - name: Install test (UEFI, unattended install then boot)
        run: |
          sudo apt-get install -yq --no-install-recommends ovmf xorriso qemu-utils
          WORK_DIR=out/install-work INSTALL_LOG=out/install-serial.log BOOT_LOG=out/installed-serial.log \
            SCREENSHOT=out/login-screen.ppm scripts/install-test.sh out/*.iso 2400

      # Screenshots of each boot stage (boot menus, splash) on BIOS, UEFI and the
      # installed disk, for reviewing the boot look. Not a pass/fail test.
      - name: Boot screenshots
        continue-on-error: true
        run: scripts/boot-screens.sh out/*.iso out/boot-screens out/install-work

      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpireos-iso
          path: |
            out/*.iso
            out/SHA256SUMS
            out/*serial.log
            out/*.ppm
            out/boot-screens/*.ppm
          retention-days: 7
          if-no-files-found: warn

      # Every tested build on main goes to the testing channel's repository.
      # Stable only changes through the "Promote testing to stable" workflow.
      - name: Publish the [mpire] package repository (testing channel)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-repo.sh repo-testing out/repo testing
