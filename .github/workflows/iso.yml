name: Build ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to build
        default: stable
        type: choice
        options: [stable, testing]

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build ISO in an Arch Linux container
        run: |
          docker run --rm --privileged \
            -v "$PWD:/src" -w /src \
            archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed archiso && ./iso/build.sh '${{ inputs.channel || 'stable' }}' /src/out"
          sudo chown -R "$(id -u):$(id -g)" out
          sha256sum out/*.iso | tee out/SHA256SUMS

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot test in QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86
          SERIAL_LOG=out/serial.log scripts/smoke-test.sh out/*.iso 1200

      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpireos-iso
          path: |
            out/*.iso
            out/SHA256SUMS
            out/serial.log
          retention-days: 7
          if-no-files-found: warn
