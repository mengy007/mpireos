name: Build ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to build
        default: stable
        type: choice
        options: [stable, testing]

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build packages and ISO in an Arch Linux container
        env:
          MPIRE_SIGNING_KEY: ${{ secrets.MPIRE_SIGNING_KEY }}
        run: |
          docker run --rm --privileged \
            -v "$PWD:/src" -w /src \
            -e MPIRE_SIGNING_KEY \
            archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed archiso base-devel \
              && ./scripts/build-packages.sh /src/out/repo '${{ inputs.channel || 'stable' }}' \
              && ./iso/build.sh '${{ inputs.channel || 'stable' }}' /src/out"
          sudo chown -R "$(id -u):$(id -g)" out
          sha256sum out/*.iso | tee out/SHA256SUMS

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot test in QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86
          SERIAL_LOG=out/serial.log SCREENSHOT=out/live-desktop.ppm scripts/smoke-test.sh out/*.iso 1200

      - name: Install test (UEFI, unattended install then boot)
        run: |
          sudo apt-get install -yq --no-install-recommends ovmf xorriso qemu-utils
          INSTALL_LOG=out/install-serial.log BOOT_LOG=out/installed-serial.log \
            scripts/install-test.sh out/*.iso 2400

      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpireos-iso
          path: |
            out/*.iso
            out/SHA256SUMS
            out/*serial.log
            out/*.ppm
          retention-days: 7
          if-no-files-found: warn

      # Installed systems update from this release (see mpire-update). Only main publishes.
      - name: Publish the [mpire] package repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view repo >/dev/null 2>&1 || \
            gh release create repo --title "MpireOS package repository" \
              --notes "Packages and channel snapshot dates used by installed MpireOS systems. Updated by CI on every push to main."
          gh release upload repo out/repo/* --clobber
