# MpireOS live ISO, UEFI boot (GRUB), with the MpireOS boot menu theme
# (packages/mpire-branding/grub/mpireos, copied to /boot/grub/themes by iso/build.sh).
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Themed graphics menu; falls back to the plain text menu if anything is missing.
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod png
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
    set mpireos_theme="/boot/grub/themes/mpireos"
    if [ -f "${mpireos_theme}/theme.txt" ]; then
        loadfont "${mpireos_theme}/inter-regular-12.pf2"
        loadfont "${mpireos_theme}/inter-regular-14.pf2"
        loadfont "${mpireos_theme}/inter-regular-16.pf2"
        loadfont "${mpireos_theme}/inter-semibold-16.pf2"
        set theme="${mpireos_theme}/theme.txt"
        export theme
    fi
fi

# Serial console, so CI (and headless machines) can see the menu too.
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Lowercase UEFI machine type, for architecture-specific tools.
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    fi
fi

default=mpireos
timeout=5
timeout_style=menu

menuentry "Start MpireOS" --class mpireos --class gnu-linux --class os --id 'mpireos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0 plymouth.ignore-serial-consoles %KERNEL_PARAMS% console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Start MpireOS and show start-up details" --hotkey d --class mpireos --class gnu-linux --class os --id 'mpireos-details' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# Accessibility: the speakup screen reader reads the console aloud, so no splash.
menuentry "Start MpireOS with a screen reader" --hotkey s --class mpireos --class gnu-linux --class os --id 'mpireos-accessibility' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS% console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a -f "/boot/memtest86+/memtest86${uefi_machine_type_lower}.efi" ]; then
    menuentry 'Test memory' --class memtest86 --class memtest --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest86${uefi_machine_type_lower}.efi
    }
elif [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Test memory' --class memtest86 --class memtest --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ -f "/shell${uefi_machine_type_lower}.efi" ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shell${uefi_machine_type_lower}.efi
        }
    fi

    menuentry 'Firmware settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Power off' --class shutdown --class poweroff {
    halt
}

# A short chime when the menu appears, for people who can't see the screen.
play 600 988 1 1319 4
