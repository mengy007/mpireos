# The MpireOS boot menu look for BIOS: splash.png (from branding/make-boot-art.py)
# draws the logo and a white card; the menu's text sits on the card.
# Text cells are 8x16 pixels on a 640x480 screen (80 columns, 30 rows); the
# *ROW settings below count from VSHIFT.
SERIAL 0 115200
UI vesamenu.c32
MENU BACKGROUND splash.png
MENU RESOLUTION 640 480

MENU WIDTH 80
MENU MARGIN 12
MENU ROWS 7
MENU VSHIFT 7
MENU TABMSGROW 20
MENU CMDLINEROW 20
MENU TIMEOUTROW 21

MENU TABMSG Press Tab to change the start-up options
MENU AUTOBOOT Starting automatically in # second{,s}

# Colors are #AARRGGBB (MpireOS palette). No shadows, no border lines.
MENU COLOR screen       37;40   #00000000 #00000000 none
MENU COLOR border       30;44   #00000000 #00000000 none
MENU COLOR title        1;36;44 #ff0b1f25 #00000000 none
MENU COLOR sel          7;37;40 #ffffffff #ff0096a3 none
MENU COLOR hotsel       1;7;37;40 #ffffffff #ff0096a3 none
MENU COLOR unsel        37;44   #ff4f5d6b #00000000 none
MENU COLOR hotkey       1;37;44 #ff0096a3 #00000000 none
MENU COLOR disabled     1;30;44 #ff8b95a3 #00000000 none
MENU COLOR scrollbar    30;44   #00000000 #00000000 none
MENU COLOR help         37;40   #ff4f5d6b #00000000 none
MENU COLOR timeout_msg  37;40   #ff8b95a3 #00000000 none
MENU COLOR timeout      1;37;40 #ff4f5d6b #00000000 none
MENU COLOR msg07        37;40   #ff4f5d6b #00000000 none
MENU COLOR tabmsg       31;40   #ff8b95a3 #00000000 none
MENU COLOR cmdmark      1;36;40 #ff269ca1 #00000000 none
MENU COLOR cmdline      37;40   #ff0b1f25 #00000000 none

MENU CLEAR
MENU IMMEDIATE
