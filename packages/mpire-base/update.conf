# MpireOS updates. See `mpire-update --help`.

# Release channel. Switch with `sudo mpire-update --channel testing` (or stable),
# which records it in /etc/mpireos/channel. Setting CHANNEL here overrides that.
#CHANNEL=stable

# Where MpireOS publishes its package repositories ("repo" for stable,
# "repo-testing" for testing) and each channel's Arch snapshot date.
#RELEASE_BASE=https://github.com/mengy007/mpireos/releases/download

# Install updates automatically in the background (daily, only on AC power).
AUTO=yes
