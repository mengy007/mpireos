# MpireOS updates. See `man mpire-update` (or `mpire-update --help`).

# Release channel: "stable" (default) or "testing".
CHANNEL=stable

# Where MpireOS publishes channel snapshot dates.
RELEASE_URL=https://github.com/mengy007/mpireos/releases/download/repo

# Install updates automatically in the background (daily, only on AC power).
AUTO=yes
